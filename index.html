<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Progresión Financiera</title>
    <style>
        :root {
            --primary: #1a365d;
            --secondary: #2b6cb0;
            --accent: #ed8936;
            --success: #38a169;
            --danger: #e53e3e;
            --bg: #f7fafc;
            --surface: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 8px;
            --table-hover: #f7fafc;
            --th-bg: #edf2f7;
        }

        /* Variables para el modo oscuro */
        [data-theme="dark"] {
            --primary: #63b3ed;
            --secondary: #4299e1;
            --bg: #1a202c;
            --surface: #2d3748;
            --text-main: #e2e8f0;
            --text-muted: #a0aec0;
            --border: #4a5568;
            --table-hover: #4a5568;
            --th-bg: #1a202c;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 1rem;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 0.5rem; }
        p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1rem 1.2rem;
            border: 1px solid var(--border);
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* Formulario */
        #calcForm {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            align-items: end;
        }

        @media (min-width: 768px) {
            #calcForm {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.2rem;
            color: var(--text-main);
            font-size: 0.85rem;
        }

        /* Estilos de inputs numéricos mejorados */
        input[type="number"],
        input[type="text"],
        select {
            width: 100%;
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.3s, color 0.3s;
            height: 32px;
        }

        /* Ocultar spinners nativos de inputs numéricos para mayor limpieza */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.2);
        }

        input.is-invalid {
            border-color: var(--danger);
            background-color: rgba(229, 62, 62, 0.1);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.8rem;
            margin-top: 0.3rem;
            display: none;
        }

        /* Botones */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .btn-row {
            display: flex;
            gap: 0.5rem;
        }

        button {
            padding: 0.7rem 1rem;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 0.95rem;
            flex: 1;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { opacity: 0.9; }

        .btn-primary { background-color: var(--secondary); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger { background-color: var(--danger); color: white; }

        /* Resultados y Tabla */
        .table-responsive {
            overflow-x: auto;
            margin-top: 0;
        }

        .results-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.95rem;
        }

        th, td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        /* Ajuste de espaciado para pantallas grandes (PC) */
        @media (min-width: 1024px) {
            th, td {
                padding: 0.5rem;
                font-size: 1rem;
            }
        }

        th {
            background-color: var(--th-bg);
            color: var(--primary);
            font-weight: 600;
            white-space: nowrap;
            transition: background-color 0.3s, color 0.3s;
        }
        
        th:first-child, td:first-child { text-align: center; }
        tbody tr:hover { background-color: var(--table-hover); }
        .val-positive { color: var(--success); font-weight: 600; }
        .val-negative { color: var(--danger); font-weight: 600; }

        /* Componentes extra */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            z-index: 1000;
            transition: background-color 0.3s, color 0.3s, transform 0.2s;
        }

        .theme-toggle:hover { transform: scale(1.1); }

        .saved-list { margin-top: 1.5rem; list-style: none; }
        .saved-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .saved-item button { padding: 0.2rem 0.5rem; font-size: 0.8rem; flex: none; }

        /* Print Styles */
        @media print {
            body { background: white; padding: 0; }
            .container { grid-template-columns: 1fr; display: block; }
            .input-section, .btn-group, .chart-container, .saved-configs-section, .theme-toggle, .results-actions { display: none !important; }
            .card { border: none; box-shadow: none; padding: 0; }
            table { border: 1px solid #000; }
            th, td { border: 1px solid #ddd; padding: 4px; font-size: 10pt; }
            header { display: none; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Cambiar modo claro/oscuro">🌙</button>

    <div class="container">
        <!-- Panel de Entradas -->
        <section class="input-section">
            <div class="card">
                <form id="calcForm" novalidate>
                    <div class="form-group">
                        <label for="capital">Capital Inicial</label>
                        <input type="number" id="capital" required min="1" max="999999999" step="any" placeholder="Ej: 1000000">
                        <div class="error-msg" id="err-capital">Ingrese un capital válido mayor a 0.</div>
                    </div>

                    <div class="form-group">
                        <label for="porcion">Porción</label>
                        <select id="porcion" required>
                            <option value="4095">Nivel 12 - 4095</option>
                            <option value="2047">Nivel 11 - 2047</option>
                            <option value="1023">Nivel 10 - 1023</option>
                            <option value="511">Nivel 9 - 511</option>
                            <option value="255">Nivel 8 - 255</option>
                            <option value="127">Nivel 7 - 127</option>
                            <option value="63">Nivel 6 - 63</option>
                            <option value="31">Nivel 5 - 31</option>
                            <option value="15">Nivel 4 - 15</option>
                            <option value="7">Nivel 3 - 7</option>
                            <option value="3">Nivel 2 - 3</option>
                            <option value="1">Nivel 1 - 1</option>
                        </select>
                        <div class="error-msg" id="err-porcion">Seleccione una porción válida.</div>
                    </div>

                    <div class="form-group">
                        <label for="numeros">Números</label>
                        <input type="number" id="numeros" required min="1" max="1000" step="1" placeholder="Ej: 14">
                        <div class="error-msg" id="err-numeros">Ingrese un número entero positivo.</div>
                    </div>

                    <div class="form-group">
                        <label for="ficha">Ficha</label>
                        <input type="number" id="ficha" required min="0.01" step="any" list="fichas-list" placeholder="Ej: 50">
                        <datalist id="fichas-list">
                            <option value="10"></option>
                            <option value="50"></option>
                            <option value="100"></option>
                            <option value="500"></option>
                            <option value="1000"></option>
                        </datalist>
                        <div class="error-msg" id="err-ficha">Ingrese el valor de la ficha (mayor a 0).</div>
                    </div>
                </form>
            </div>
        </section>

        <!-- Panel de Resultados -->
        <main class="results-section">
            <div class="card" id="resultsCard" style="display: none;">
                <div class="table-responsive">
                    <table id="resultsTable">
                        <thead>
                            <tr>
                                <th title="Iteración / Nivel">ENT (A)</th>
                                <th title="Valor base a apostar/invertir">Valor (B)</th>
                                <th title="Carga total del periodo (Valor * Números)">Carga (C)</th>
                                <th title="Inversión acumulada hasta este periodo">Inv (D)</th>
                                <th title="Pago potencial si se acierta (Valor * Multiplicador)">Pago (E)</th>
                                <th title="Ganancia neta (Pago - Inv)">Ganancia (F)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Generado por JS vía DocumentFragment -->
                        </tbody>
                    </table>
                </div>

                <div class="results-actions">
                    <button class="btn-outline" onclick="window.print()" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">🖨️ Imprimir</button>
                    <button class="btn-outline" id="btnExportCSV" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">📥 CSV</button>
                </div>
            </div>

            <!-- Botones y Configuraciones Guardadas -->
            <div class="card saved-configs-section" style="margin-top: 1.5rem;">
                <div class="btn-group" style="margin-top: 0; flex-direction: row; flex-wrap: wrap;">
                    <button type="button" class="btn-primary" id="btnCalcular" style="flex: 2; min-width: 200px;">Calcular Proyección</button>
                    <div class="btn-row" style="flex: 1; min-width: 200px;">
                        <button type="button" class="btn-outline" id="btnLimpiar">Limpiar</button>
                        <button type="button" class="btn-success" id="btnGuardar">Guardar</button>
                    </div>
                </div>

                <div style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                    <h3 style="font-size: 1rem; color: var(--primary);">Configuraciones Guardadas</h3>
                    <ul class="saved-list" id="savedList">
                        <li class="saved-item" style="color: var(--text-muted); border: none;">No hay datos guardados</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- CONSTANTES DE NEGOCIO ---
        const PAYOUT_MULTIPLIER = 36;
        const MAX_SAFE_ITERATIONS = 25;
        const STORAGE_KEY = 'calc_fin_configs';
        const AUTOSAVE_KEY = 'calc_fin_autosave';
        const THEME_KEY = 'calc_fin_theme';

        // --- OPTIMIZACIÓN DE MEMORIA: Instanciación única del formateador ---
        const numberFormatter = new Intl.NumberFormat('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        const formatNum = (num) => numberFormatter.format(num);

        // --- ELEMENTOS DOM ---
        const form = document.getElementById('calcForm');
        const inputs = {
            capital: document.getElementById('capital'),
            porcion: document.getElementById('porcion'),
            numeros: document.getElementById('numeros'),
            ficha: document.getElementById('ficha')
        };
        const resultsCard = document.getElementById('resultsCard');
        const tbody = document.querySelector('#resultsTable tbody');
        const btnCalcular = document.getElementById('btnCalcular');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const btnGuardar = document.getElementById('btnGuardar');
        const btnExportCSV = document.getElementById('btnExportCSV');
        const savedList = document.getElementById('savedList');
        const themeToggle = document.getElementById('themeToggle');

        // Estado global de resultados
        let currentResults = [];

        // --- LÓGICA DE TEMAS ---
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            if (savedTheme) {
                setTheme(savedTheme);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                setTheme(prefersDark ? 'dark' : 'light');
            }
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        // --- LÓGICA DE AUTOGUARDADO (ÚLTIMA SESIÓN) ---
        function guardarSesionActual() {
            const estadoActual = {
                capital: inputs.capital.value,
                porcion: inputs.porcion.value,
                numeros: inputs.numeros.value,
                ficha: inputs.ficha.value
            };
            localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(estadoActual));
        }

        function restaurarSesionAnterior() {
            const estadoGuardado = localStorage.getItem(AUTOSAVE_KEY);
            if (estadoGuardado) {
                try {
                    const estado = JSON.parse(estadoGuardado);
                    inputs.capital.value = estado.capital || '1000000';
                    inputs.porcion.value = estado.porcion || '511';
                    inputs.numeros.value = estado.numeros || '14';
                    inputs.ficha.value = estado.ficha || '50';
                } catch (e) {
                    console.error("Error al leer el autoguardado", e);
                }
            } else {
                // Valores por defecto si es la primera vez
                inputs.capital.value = '1000000';
                inputs.porcion.value = '511';
                inputs.numeros.value = '14';
                inputs.ficha.value = '50';
            }
        }

        // --- VALIDACIÓN DE FORMULARIO ---
        function validateInput(input, showError = true) {
            let isValid = true;
            const val = parseFloat(input.value);
            
            if (isNaN(val) || input.value.trim() === '') {
                isValid = false;
            } else {
                switch(input.id) {
                    case 'capital': isValid = val > 0; break;
                    case 'porcion': isValid = val >= 1 && Number.isInteger(val); break;
                    case 'numeros': isValid = val >= 1 && Number.isInteger(val); break;
                    case 'ficha': isValid = val > 0; break;
                }
            }

            if (!isValid && input.value !== '' && showError) {
                input.classList.add('is-invalid');
                document.getElementById(`err-${input.id}`).style.display = 'block';
            }
            return isValid;
        }

        function checkFormValidity() {
            let allValid = true;
            Object.values(inputs).forEach(input => {
                if (input.value === '' || input.classList.contains('is-invalid')) allValid = false;
            });
            btnCalcular.disabled = !allValid;
            return allValid;
        }

        // --- LÓGICA DE NEGOCIO (DESACOPLADA) ---
        function generarProgresion(capital, porcion, numeros, ficha) {
            const resultados = [];
            const baseCalculo = capital / porcion;
            const h1 = baseCalculo / numeros;
            const maxEntTeorico = Math.floor(Math.log2(porcion + 1)); 
            const maxIteraciones = maxEntTeorico > 0 ? Math.max(maxEntTeorico, 15) : 15;
            let invAcumulada = 0;

            for (let n = 1; n <= MAX_SAFE_ITERATIONS; n++) {
                let hn = h1 * Math.pow(2, n - 1);
                let i_n = Math.floor(hn / ficha);
                let valor = i_n * ficha;
                let carga = valor * numeros;
                invAcumulada += carga;
                let pago = valor * PAYOUT_MULTIPLIER;
                let ganancia = pago - invAcumulada;

                if (n > maxIteraciones && invAcumulada > capital) break;

                resultados.push({ ent: n, valor, carga, inv: invAcumulada, pago, ganancia });
            }
            return resultados;
        }

        // --- MANEJO DE EVENTOS ---
        Object.values(inputs).forEach(input => {
            input.addEventListener('blur', () => validateInput(input));
            input.addEventListener('input', () => {
                input.classList.remove('is-invalid');
                document.getElementById(`err-${input.id}`).style.display = 'none';
                
                const isValid = checkFormValidity();
                guardarSesionActual(); 
                
                // Calculamos pero NO hacemos scroll automático
                if(isValid) procesarYRenderizar(false); 
            });
        });

        btnCalcular.addEventListener('click', (e) => {
            e.preventDefault();
            if (checkFormValidity()) {
                procesarYRenderizar(true); // SÍ hacemos scroll al hacer click
            }
        });

        function procesarYRenderizar(shouldScroll) {
            const cap = parseFloat(inputs.capital.value);
            const por = parseFloat(inputs.porcion.value);
            const num = parseFloat(inputs.numeros.value);
            const fic = parseFloat(inputs.ficha.value);

            currentResults = generarProgresion(cap, por, num, fic);
            renderizarTabla(shouldScroll);
        }

        // --- RENDERIZADO OPTIMIZADO (DOM) ---
        function renderizarTabla(shouldScroll) {
            tbody.innerHTML = '';
            
            // Uso de DocumentFragment para evitar repaints continuos
            const fragment = document.createDocumentFragment();
            
            currentResults.forEach(row => {
                const tr = document.createElement('tr');
                const gananciaClass = row.ganancia >= 0 ? 'val-positive' : 'val-negative';

                tr.innerHTML = `
                    <td>${row.ent}</td>
                    <td>${formatNum(row.valor)}</td>
                    <td>${formatNum(row.carga)}</td>
                    <td>${formatNum(row.inv)}</td>
                    <td>${formatNum(row.pago)}</td>
                    <td class="${gananciaClass}">${formatNum(row.ganancia)}</td>
                `;
                fragment.appendChild(tr);
            });

            tbody.appendChild(fragment);
            resultsCard.style.display = 'block';
            
            if (shouldScroll) {
                resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // --- EXPORTACIÓN CSV CORREGIDA (EXCEL ESPAÑA/LATAM) ---
        btnExportCSV.addEventListener('click', () => {
            if (currentResults.length === 0) return;

            let csvContent = "ENT;Valor;Carga;Inv;Pago;Ganancia\n";
            
            currentResults.forEach(r => {
                let row = [
                    r.ent,
                    r.valor.toFixed(2).replace('.', ','),
                    r.carga.toFixed(2).replace('.', ','),
                    r.inv.toFixed(2).replace('.', ','),
                    r.pago.toFixed(2).replace('.', ','),
                    r.ganancia.toFixed(2).replace('.', ',')
                ];
                csvContent += row.join(";") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "Proyeccion_Financiera.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // --- LIMPIAR Y GESTIÓN DE LOCALSTORAGE ---
        btnLimpiar.addEventListener('click', () => {
            form.reset();
            Object.values(inputs).forEach(input => {
                input.classList.remove('is-invalid');
                document.getElementById(`err-${input.id}`).style.display = 'none';
            });
            resultsCard.style.display = 'none';
            currentResults = [];
            btnCalcular.disabled = false;
            guardarSesionActual();
        });

        function getConfigs() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveConfigs(configs) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(configs));
            renderSavedList();
        }

        btnGuardar.addEventListener('click', () => {
            if (!checkFormValidity()) {
                alert('Por favor llene todos los campos con valores válidos antes de guardar.');
                return;
            }
            
            const configName = prompt("Ingrese un nombre para esta configuración:");
            if (!configName) return;

            const newConfig = {
                id: Date.now(),
                name: configName,
                capital: inputs.capital.value,
                porcion: inputs.porcion.value,
                numeros: inputs.numeros.value,
                ficha: inputs.ficha.value
            };

            const configs = getConfigs();
            configs.push(newConfig);
            saveConfigs(configs);
        });

        function loadConfig(id) {
            const configs = getConfigs();
            const config = configs.find(c => c.id === id);
            if (config) {
                inputs.capital.value = config.capital;
                inputs.porcion.value = config.porcion;
                inputs.numeros.value = config.numeros;
                inputs.ficha.value = config.ficha;
                
                checkFormValidity();
                guardarSesionActual();
                procesarYRenderizar(true);
            }
        }

        function deleteConfig(id) {
            if(confirm('¿Eliminar esta configuración guardada?')) {
                let configs = getConfigs();
                configs = configs.filter(c => c.id !== id);
                saveConfigs(configs);
            }
        }

        function renderSavedList() {
            const configs = getConfigs();
            savedList.innerHTML = '';
            
            if (configs.length === 0) {
                savedList.innerHTML = '<li class="saved-item" style="color: var(--text-muted); border: none;">No hay datos guardados</li>';
                return;
            }

            configs.forEach(config => {
                const li = document.createElement('li');
                li.className = 'saved-item';
                
                const title = document.createElement('span');
                title.textContent = config.name;
                title.style.cursor = 'pointer';
                title.style.color = 'var(--secondary)';
                title.title = `Cap: ${config.capital} | Porc: ${config.porcion} | Núm: ${config.numeros} | Fic: ${config.ficha}`;
                title.onclick = () => loadConfig(config.id);

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-danger';
                delBtn.textContent = 'X';
                delBtn.onclick = () => deleteConfig(config.id);

                li.appendChild(title);
                li.appendChild(delBtn);
                savedList.appendChild(li);
            });
        }

        // --- INICIALIZACIÓN DE LA APLICACIÓN ---
        initTheme();
        renderSavedList();
        restaurarSesionAnterior();
        
        // Ejecución inicial silenciosa (sin forzar el scroll al abrir la app)
        if (checkFormValidity()) {
            procesarYRenderizar(false);
        }
    </script>
</body>
</html>
